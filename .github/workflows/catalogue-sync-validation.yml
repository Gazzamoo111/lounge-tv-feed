name: Catalogue sync planner validation
on:
  pull_request:
    paths:
      - 'scripts/catalogue-sync*'
      - 'tests/test_catalogue_sync.py'
      - '.github/workflows/catalogue-sync.yml'
      - 'tests/catalogue-sync-plan.test.mjs'
      - '.github/workflows/catalogue-sync-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/catalogue-sync-plan.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_catalogue_sync.py'
