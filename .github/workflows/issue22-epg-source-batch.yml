name: Issue 22 encrypted 25-source EPG fetch
on:
  push:
    branches:
      - epg/issue-22-private-source-batch
    paths:
      - 'issue22/**'
      - '.github/workflows/issue22-epg-source-batch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=42,<50'
      - name: Fetch and encrypt 25 approved EPG sources
        run: python issue22/download_sources.py
      - name: Upload encrypted source archive and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue22-encrypted-xmltv-source-batch
          path: |
            issue22/batch-download/encrypted_feeds.bin
            issue22/batch-download/source_status.json
          retention-days: 1
          if-no-files-found: warn
