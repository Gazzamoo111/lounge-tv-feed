name: Issue 22 targeted final EPG gaps
on:
  push:
    branches:
      - epg/issue-22-private-source-batch
    paths:
      - '.github/workflows/issue22-targeted-final.yml'
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=42,<50'
      - name: Validate targeted supplementary XMLTV and encrypt outputs
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures,datetime,json,tarfile
          import issue22.download_sources as d
          d.MAX_BYTES=240*1024*1024
          d.MAX_UNPACKED=1300*1024*1024
          d.FEEDS.mkdir(parents=True,exist_ok=True)
          extra=[
              {'id':'cathy-world-retry','country':'global','url':'https://raw.githubusercontent.com/waastudios/Cathy-epg/master/data/epg.xml.gz'},
              {'id':'share-us-sports','country':'us','url':'https://epgshare01.online/epgshare01/epg_ripper_US_SPORTS1.xml.gz'},
              {'id':'share-ie','country':'global','url':'https://epgshare01.online/epgshare01/epg_ripper_IE1.xml.gz'},
              {'id':'open-us1','country':'us','url':'https://www.open-epg.com/files/unitedstates1.xml.gz'},
              {'id':'talk-us','country':'us','url':'https://epgtalk.com/US_guide.xml.gz'},
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              rows=list(pool.map(d.fetch_source,extra))
          for row in rows:print(row['id'],row['status'],row.get('bytes',''),row.get('guide_channels',''),flush=True)
          status={'created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sources':extra,'results':rows}
          (d.OUT/'source_status.json').write_text(json.dumps(status,indent=2))
          with tarfile.open(d.OUT/'batch.tar.gz','w:gz',compresslevel=2) as tar:
              tar.add(d.OUT/'source_status.json',arcname='source_status.json')
              for row in rows:
                  if row['status']=='ok':tar.add(d.FEEDS/(row['id']+'.xmltv'),arcname='feeds/'+row['id']+'.xmltv')
          d.encrypt_bundle(d.OUT/'batch.tar.gz',d.OUT/'encrypted_feeds.bin',d.ROOT/'runner_public_key.pem')
          (d.OUT/'batch.tar.gz').unlink()
          if not any(row['status']=='ok' for row in rows):raise SystemExit('No validated source')
          PY
      - name: Upload private encrypted validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue22-encrypted-final-candidates
          path: |
            issue22/batch-download/encrypted_feeds.bin
            issue22/batch-download/source_status.json
          retention-days: 3
          if-no-files-found: warn
