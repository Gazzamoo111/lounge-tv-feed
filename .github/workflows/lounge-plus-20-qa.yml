name: Lounge TV Plus 20-category QA
on:
  push:
    branches:
      - qa/lounge-plus-20-20261119
  workflow_dispatch:
jobs:
  plus-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test qa/lounge-plus-20/*.test.mjs
      - name: Verify deployed QA function boots independently
        shell: bash
        run: |
          code=$(curl --silent --show-error --max-time 25 --output /tmp/plus-response.json --write-out '%{http_code}' \
            'https://liqocisegeqzbyuqloql.supabase.co/functions/v1/lounge-plus-qa/__qa-route-not-found')
          test "$code" = 404
          grep -q 'not_found' /tmp/plus-response.json

      - name: Confirm actual M3U route reaches authentication gate
        shell: bash
        run: |
          code=$(curl --silent --show-error --max-time 25 --output /tmp/plus-get-no-auth.json --write-out '%{http_code}' \
            'https://liqocisegeqzbyuqloql.supabase.co/functions/v1/lounge-plus-qa/get.php')
          test "$code" = 403
          grep -q '"not_allowed"' /tmp/plus-get-no-auth.json
      - name: Confirm Xtream live-categories route reaches authentication gate
        shell: bash
        run: |
          code=$(curl --silent --show-error --max-time 25 --output /tmp/plus-xtream-no-auth.json --write-out '%{http_code}' \
            'https://liqocisegeqzbyuqloql.supabase.co/functions/v1/lounge-plus-qa/player_api.php?action=get_live_categories')
          test "$code" = 401
          grep -q '"auth":0' /tmp/plus-xtream-no-auth.json
      - name: Confirm Xtream live-stream route reaches authentication gate
        shell: bash
        run: |
          code=$(curl --silent --show-error --max-time 25 --output /tmp/plus-xtream-live-no-auth.json --write-out '%{http_code}' \
            'https://liqocisegeqzbyuqloql.supabase.co/functions/v1/lounge-plus-qa/player_api.php?action=get_live_streams')
          test "$code" = 401
          grep -q '"auth":0' /tmp/plus-xtream-live-no-auth.json

      - name: Confirm existing n.loungetv.nz routes to the v36 authentication gateway
        shell: bash
        run: |
          code=$(curl --silent --show-error --max-time 25 --output /tmp/n-live-no-auth.json --write-out '%{http_code}' \
            'https://n.loungetv.nz/player_api.php?action=get_live_categories')
          printf 'n.loungetv.nz auth-gate response: %s\n' "$code"
          test "$code" = 401
          grep -q '"auth":0' /tmp/n-live-no-auth.json
