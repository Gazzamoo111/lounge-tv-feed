name: QA Nuvio Xtream ordering

on:
  push:
    branches:
      - qa/nuvio-gateway-20261115
    paths:
      - 'qa/channel-priority.mjs'
      - 'qa/channel-priority.test.mjs'
      - 'qa/xtream-ordering.test.mjs'
      - 'qa/priority-uk-us-sports.test.mjs'
      - 'qa/n-v10-index.ts'
      - 'qa/n-v12-index.ts'
      - 'qa/qa-247-groups.mjs'
      - 'qa/qa-247-groups.test.mjs'
      - 'qa/n-v13-index.ts'
      - 'qa/n-v14-index.ts'
      - 'qa/n-v15-index.ts'
      - 'qa/n-v16-index.ts'
      - 'qa/qa-epg-alias.mjs'
      - 'qa/qa-epg-alias.test.mjs'
      - 'qa/qa-sky-fhd-primary.mjs'
      - 'qa/qa-sky-fhd-primary.test.mjs'
      - 'qa/qa-sky-hd-backups.mjs'
      - 'qa/qa-sky-hd-backups.test.mjs'
      - 'qa/qa-au-duplicates.mjs'
      - 'qa/qa-au-duplicates.test.mjs'
      - 'qa/qa-stream-groups.mjs'
      - 'qa/qa-stream-groups.test.mjs'
      - '.github/workflows/qa-nuvio-order.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-xtream-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ranking and PPV regression tests
        run: node --test qa/channel-priority.test.mjs qa/xtream-ordering.test.mjs qa/priority-uk-us-sports.test.mjs qa/qa-247-groups.test.mjs qa/qa-stream-groups.test.mjs qa/qa-au-duplicates.test.mjs qa/qa-sky-fhd-primary.test.mjs qa/qa-sky-hd-backups.test.mjs qa/qa-epg-alias.test.mjs
