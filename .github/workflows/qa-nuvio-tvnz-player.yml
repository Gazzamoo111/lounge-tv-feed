name: QA Nuvio TVNZ Widevine Xtream build
on:
  push:
    branches:
      - qa/nuvio-gateway-20261115
    paths:
      - 'qa/nuvio-drm-qa/**'
      - 'qa/n-v22-index.ts'
      - '.github/workflows/qa-nuvio-tvnz-player.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Lounge TV QA scripts
        uses: actions/checkout@v4
        with:
          path: lounge
      - name: Checkout pinned Nuvio + IPTV source
        uses: actions/checkout@v4
        with:
          repository: homelessbrian/NuvioPlusIPTV
          ref: 4d9748511e1fb66fb1a0713a1024f1dcd01174a6
          path: nuvio
      - name: Validate patch script
        run: |
          python3 -m py_compile lounge/qa/nuvio-drm-qa/patch_xtream.py
      - name: Apply TVNZ Xtream patch, fail closed on upstream changes
        run: |
          python3 lounge/qa/nuvio-drm-qa/patch_xtream.py nuvio
          python3 lounge/qa/nuvio-drm-qa/test_patch.py nuvio
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: nuvio/vpn-android/native/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: nuvio/**/build.gradle.kts
      - name: Build standalone APK without replacing user's installed Nuvio
        working-directory: nuvio
        env:
          CI_USE_DEBUG_SIGNING: 'true'
        run: |
          chmod +x gradlew
          # Maven Central occasionally rate-limits newly provisioned Actions runners.
          # Reuse Gradle's cache and retry boundedly, without simultaneous downloads.
          for attempt in 1 2 3; do
            if ./gradlew :app:assembleFullRelease --no-parallel --build-cache -PlivetvTestBuild=true \
              -x lintVitalAnalyzeFullRelease -x lintVitalReportFullRelease -x lintVitalFullRelease; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt*45))
          done
      - name: Verify APK and test application ID
        working-directory: nuvio
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/full/release/output-metadata.json
          jq -r '{applicationId,variantName,outputs:[.elements[].outputFile]}' app/build/outputs/apk/full/release/output-metadata.json
          jq -e '.applicationId == "com.nuvio.livetv.test"' app/build/outputs/apk/full/release/output-metadata.json
          find app/build/outputs/apk/full/release -name '*.apk' -size +100k | head -n 1 | grep .
      - name: Upload TVNZ QA build
        uses: actions/upload-artifact@v4
        with:
          name: lounge-tvnz-widevine-nuvio-qa
          path: nuvio/app/build/outputs/apk/full/release/*.apk
          retention-days: 7
          if-no-files-found: error
