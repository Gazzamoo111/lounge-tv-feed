name: Refresh Lounge Fast EPG

on:
  push:
    paths:
      - "scripts/build_fast_epg.py"
      - "scripts/export_epg_channel_index.py"
      - "config/best_epg_verified_aliases.json"
      - ".github/workflows/refresh-fast-epg.yml"

  workflow_dispatch:

  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh upstream EPG and rebuild Lounge guide
        run: |
          python scripts/refresh_epg_only.py
          python scripts/export_epg_channel_index.py

      - name: Refresh premium artwork cache
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: |
          if [ -n "$TMDB_BEARER_TOKEN" ]; then
            python scripts/build_artwork_manifest.py
          else
            echo "TMDB token unset; skip optional artwork"
          fi

      - name: Commit refreshed fast EPG
        run: |
          git config user.name "Lounge Feed Bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/epg6-live.xml
          git add docs/epg-channel-index.json
          git add docs/epg-now-next.json
          git add docs/epg-guide.json
          git add docs/lounge-events.json
          if [ -d docs/artwork ]; then git add docs/artwork; fi

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Refresh Lounge fast EPG"
          # Keep a refresh from failing when an unrelated commit lands mid-run.
          git pull --rebase origin main
          git push
