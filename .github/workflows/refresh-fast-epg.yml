name: Refresh Lounge Fast EPG

on:
  push:
    paths:
      - "scripts/build_fast_epg.py"

  workflow_dispatch:

  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild fast Now Next feed
        run: python scripts/build_fast_epg.py

      - name: Refresh premium artwork cache
        if: ${{ secrets.TMDB_BEARER_TOKEN != '' }}
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: python scripts/build_artwork_manifest.py

      - name: Commit refreshed fast EPG
        run: |
          git config user.name "Lounge Feed Bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/epg-now-next.json
          git add docs/epg-guide.json
          git add docs/lounge-events.json
          git add docs/artwork

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Refresh Lounge fast EPG"
          git push
