name: Secure provisioning regression
on:
  push:
    branches: [feature/secure-provisioning-20261125]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test standalone-xtream/tests/*.test.mjs
