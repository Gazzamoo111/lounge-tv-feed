name: Standalone EPG-only route validation
on:
  push:
    branches:
      - feature/standalone-epg-source-20261123
    paths:
      - 'standalone-epg/**'
      - '.github/workflows/standalone-epg-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test standalone-epg/worker/tests/worker.test.mjs
      - name: Check isolation from existing services
        shell: bash
        run: |
          if grep -R -E 'supabase\.co|n\.loungetv\.nz/live|connect\.loungetv\.nz/live' standalone-epg/worker/src; then
            echo 'Unexpected hard-coded production reference'; exit 1
          fi
          echo 'Standalone handler has no Supabase or existing gateway dependency'
