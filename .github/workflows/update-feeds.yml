name: Update Lounge Feeds

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lounge feeds
        run: python scripts/update_feeds.py

      - name: Commit updated feeds
        run: |
          git config user.name "Lounge Feed Bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/lounge-clean.m3u
          git add docs/epg6-live.xml

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update Lounge feeds"
          git push
