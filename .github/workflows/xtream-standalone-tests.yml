name: Lounge TV isolated Xtream QA tests
on:
  push:
    branches:
      - feature/xtream-no-supabase-20261123
    paths:
      - 'standalone-xtream/**'
      - '.github/workflows/xtream-standalone-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Xtream compatibility, credentials, EPG, playback routes
        run: node --test standalone-xtream/tests/worker.test.mjs
      - name: Ensure no runtime Supabase dependency
        shell: bash
        run: |
          if grep -Ei 'supabase\\.co|SUPABASE_URL|SUPABASE_SERVICE_ROLE' standalone-xtream/src/worker.mjs; then
            echo 'Unexpected Supabase dependency in standalone Xtream Worker'
            exit 1
          fi
          echo 'Standalone Xtream Worker has no Supabase runtime dependency'
