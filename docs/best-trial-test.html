<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lounge TV BEST trial test</title>
<style>body{font:16px system-ui;color:#ecf3fb;background:#0c1420;max-width:760px;margin:30px auto;padding:18px}section{border:1px solid #34465b;background:#1b2939;border-radius:12px;padding:22px;margin:16px 0}input,select,button{padding:12px;font:inherit;border-radius:7px;box-sizing:border-box}input,select{display:block;width:100%;margin:6px 0 14px;color:white;background:#111c2b;border:1px solid #586a80}button{cursor:pointer;background:#3fe0c6;border:0;color:#0a2521;font-weight:700;margin:6px}button:disabled{opacity:.35;cursor:not-allowed}p{color:#b1c1d6}#result{white-space:pre-wrap;overflow-wrap:anywhere}.hidden{display:none}</style>
<h1>Lounge TV · BEST trial QA</h1><p>Admin-only test. ONE demo ticket is used only after choosing and explicitly confirming a pending request.</p>
<section id="login"><h2>Sign in as Lounge TV admin</h2><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="signin">Sign in</button></section>
<section id="panel" class="hidden"><h2>Preflight</h2><button id="refresh">Refresh BEST / requests</button><p id="status"></p><h2>Test registration</h2><label>Pending trial request<select id="request"></select></label><label>Content template<select id="template"></select></label><button id="check">Check eligibility</button><p id="eligible"></p><button id="issue" disabled>Issue and approve ONE BEST demo</button><button id="signout">Sign out</button></section>
<section><h2>Result</h2><div id="result">Sign in to begin.</div></section>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const sb=createClient("https://liqocisegeqzbyuqloql.supabase.co","sb_publishable_hAnd78k7ZrCH7okAM-ylaQ_Kosu5DnA");const el=id=>document.getElementById(id);
let requests=[], eligible=null;
const show=x=>el("result").textContent=typeof x==="string"?x:JSON.stringify(x,null,2);
async function api(action,extra={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error("Sign in required");const r=await fetch("https://liqocisegeqzbyuqloql.supabase.co/functions/v1/lounge-best-test-trial",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:"sb_publishable_hAnd78k7ZrCH7okAM-ylaQ_Kosu5DnA","Content-Type":"application/json"},body:JSON.stringify({action,...extra})});const x=await r.json().catch(()=>({error:"Unexpected server response"}));if(!r.ok)throw Error(x.error||"Request failed");return x}
async function refresh(){const [info,ts,pending]=await Promise.all([api("preflight"),api("templates"),api("pending")]);requests=pending.requests;el("status").textContent="BEST: "+info.account+" | Credits: "+info.credits+" | Default template: "+ts.default_template_id;el("request").replaceChildren(new Option("Select pending trial…",""),...requests.map(r=>new Option(r.reference+" | "+r.full_name+" | "+r.email+(r.email_verified?"":" (not verified)"),r.id)));el("template").replaceChildren(...ts.templates.map(t=>new Option(t.name+" (#"+t.id+")",t.id)));el("template").value=ts.default_template_id;el("issue").disabled=true;eligible=null;show("Pending trials: "+requests.length+". No BEST demo created.");}
el("signin").onclick=async()=>{try{const {error}=await sb.auth.signInWithPassword({email:el("email").value.trim(),password:el("password").value});if(error)throw error;el("login").classList.add("hidden");el("panel").classList.remove("hidden");await refresh()}catch(e){show(e.message)}};
el("refresh").onclick=async()=>{try{await refresh()}catch(e){show(e.message)}};
el("check").onclick=async()=>{try{if(!el("request").value)throw Error("Select pending request");eligible=await api("check",{request_id:el("request").value});el("eligible").textContent=eligible.eligible?"Eligible for one demo trial":eligible.blockers.join(", ");el("issue").disabled=!eligible.eligible;show(eligible)}catch(e){show(e.message)}};
el("request").onchange=()=>{eligible=null;el("issue").disabled=true};el("template").onchange=()=>{eligible=null;el("issue").disabled=true};
el("issue").onclick=async()=>{const r=requests.find(x=>x.id===el("request").value);if(!r||!eligible?.eligible)return;const input=prompt("This will issue ONE REAL BEST demo ticket. Type the exact Lounge TV request reference:",r.reference);if(input!==r.reference){show("Cancelled");return;}el("issue").disabled=true;try{show("Creating exactly one BEST demo and linking it to the customer…");const result=await api("issue",{request_id:r.id,template_id:el("template").value,confirm_reference:input,confirmation:"CREATE ONE BEST DEMO"});show(result)}catch(e){show("STOP: "+e.message+"\nDo not retry before reviewing the existing attempt.")}};
el("signout").onclick=async()=>{await sb.auth.signOut();location.reload()};
const {data:{session}}=await sb.auth.getSession();if(session){el("login").classList.add("hidden");el("panel").classList.remove("hidden");refresh().catch(e=>show(e.message))}
</script></html>
